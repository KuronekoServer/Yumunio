services:
  yumunio:
    environment:
      YUMUNIO_STORAGE: sqlite
      YUMUNIO_ACCESS_KEY: "${YUMUNIO_ACCESS_KEY:-}"
      YUMUNIO_PUBLIC_ORIGIN: "${YUMUNIO_PUBLIC_ORIGIN:-http://127.0.0.1:8788}"
      YUMUNIO_DATABASE: /app/.data/yumunio.sqlite
    volumes:
      - yumunio-data:/app/.data
volumes:
  yumunio-data:
