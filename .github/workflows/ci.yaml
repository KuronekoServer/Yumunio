name: Check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [Linux, Windows]
    runs-on: [self-hosted, "${{ matrix.os }}", X64, build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Use canonical temporary paths for filesystem fixtures
        run: node --input-type=module -e "import {appendFileSync, realpathSync} from 'node:fs'; const directory = realpathSync(process.env.RUNNER_TEMP); appendFileSync(process.env.GITHUB_ENV, ['TMPDIR','TMP','TEMP'].map(name => name + '=' + directory + '\n').join(''));"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run repo:check
      - run: npm run l10n:sync
      - run: npm run check
      - run: npm test
      - run: npm run test:worker
      - run: node --test packages/backup/integration/workerd.mjs
  container-build:
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and boot a new installation
        run: |
          set -euo pipefail
          YUMUNIO_PUBLIC_ORIGIN=https://notes.example.invalid docker compose -f compose.yaml -f compose.https.yaml config --quiet
          docker run --rm -e YUMUNIO_PUBLIC_ORIGIN=https://notes.example.invalid --mount "type=bind,source=$PWD/deploy/Caddyfile,target=/etc/caddy/Caddyfile,readonly" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile >/dev/null
          smoke="yumunio-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          image="yumunio-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$smoke" >/dev/null 2>&1 || true; docker image rm "$image" >/dev/null 2>&1 || true' EXIT
          docker build --tag "$image" .
          docker run --detach --name "$smoke" "$image"
          docker exec "$smoke" node --input-type=module -e 'for(let attempt=0;attempt<30;attempt++){try{const response=await fetch("http://127.0.0.1:8788/health");const body=await response.json();if(response.ok&&body.status==="setup-required")process.exit(0);}catch{}await new Promise(resolve=>setTimeout(resolve,1000));}process.exit(1);'
  database-contract:
    runs-on: [self-hosted, Linux, X64, build]
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: yumunio_test_ci
          MARIADB_USER: yumunio_test
          MARIADB_PASSWORD: fixture-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: yumunio_test_ci
          POSTGRES_USER: yumunio_test
          POSTGRES_PASSWORD: fixture-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U yumunio_test -d yumunio_test_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:databases
        env:
          YUMUNIO_TEST_MYSQL_URL: mysql://yumunio_test:fixture-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:${{ job.services.mariadb.ports[3306] }}/yumunio_test_ci
          YUMUNIO_TEST_POSTGRES_URL: postgres://yumunio_test:fixture-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:${{ job.services.postgres.ports[5432] }}/yumunio_test_ci
