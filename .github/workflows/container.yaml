name: Publish container
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64}
          - {arch: arm64}
    runs-on: [self-hosted, Linux, X64, release]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: matrix.arch == 'arm64'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push image
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          smoke="yumunio-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${IMAGE_ARCH}"
          docker_config=''
          trap 'docker rm -f "$smoke" >/dev/null 2>&1 || true; if [[ -n "$docker_config" ]]; then rm -rf "$docker_config"; fi' EXIT
          docker buildx build --load --platform "linux/$IMAGE_ARCH" --pull --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image:sha-$GITHUB_SHA-$IMAGE_ARCH" .
          docker run --detach --platform "linux/$IMAGE_ARCH" --name "$smoke" "$image:sha-$GITHUB_SHA-$IMAGE_ARCH"
          docker exec "$smoke" node --input-type=module -e 'for(let attempt=0;attempt<30;attempt++){try{const response=await fetch("http://127.0.0.1:8788/health");const body=await response.json();if(response.ok&&body.status==="setup-required")process.exit(0);}catch{}await new Promise(resolve=>setTimeout(resolve,1000));}process.exit(1);'
          docker_config="$(mktemp -d "${RUNNER_TEMP}/yumunio-docker.XXXXXXXX")"
          export DOCKER_CONFIG="$docker_config"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$image:sha-$GITHUB_SHA-$IMAGE_ARCH"
  manifest:
    needs: build
    runs-on: [self-hosted, Linux, X64, release]
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Publish multi-platform tag
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP}/yumunio-docker.XXXXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          tag=latest
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then tag="${GITHUB_REF_NAME#v}"; fi
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker manifest create "$image:$tag" "$image:sha-$GITHUB_SHA-amd64" "$image:sha-$GITHUB_SHA-arm64"
          docker manifest push "$image:$tag"
  dockerhub:
    needs: manifest
    if: vars.DOCKERHUB_IMAGE != ''
    runs-on: [self-hosted, Linux, X64, release]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.16.0'
          package-manager-cache: false
      - name: Mirror tested images and verify public Docker Hub access
        run: node packages/tooling/publish-dockerhub.mjs
        env:
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
