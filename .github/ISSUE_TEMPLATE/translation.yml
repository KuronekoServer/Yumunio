name: 翻訳の修正・追加 / Translation
description: 表示文言・新しい言語の提案 / Suggest better wording or a new language.
title: "[Translation] "
body:
  - type: markdown
    attributes:
      value: |
        翻訳への協力を歓迎します。言語コードや翻訳キーが分からなくても、画面と文言で報告できます。
        例文や画像には個人情報・実際のノート内容を含めないでください。
        You can write in your language. Describe the screen and suggested wording; translation keys are optional.
        Exclude personal information and private page content. [Browser contribution guide](https://github.com/KuronekoServer/Yumunio/blob/master/docs/community-translations.en.md).
  - type: input
    id: locale
    attributes:
      label: 対象の言語 / Language
      placeholder: "例: 日本語（ja） / English（en）"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 翻訳キー・ファイル・表示箇所 / Screen or file
      description: 分かる範囲で記入してください。画面名と操作手順だけでも大丈夫です。 / A screen name and steps are enough; keys are optional.
      placeholder: "例: ワークスペース設定 → 外観 の保存ボタン"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 現在の文言と提案する文言 / Current and proposed wording
      description: 新しい言語なら翻訳したい範囲や例文を記入します。 / For a new language, describe the scope or give an example.
      placeholder: |
        現在:
        提案:
        理由や、文言が使われる場面:
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 補足（任意） / Context (optional)
      description: 用語の使い分け、複数形、文字切れなど。 / Terminology, plurals, text overflow, or other context.
