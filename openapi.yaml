    TokenScopes:
      type: array
      minItems: 1
      maxItems: 4
      items:
        type: string
        enum:
          - page:read
          - document:read
          - document:write
          - mcp:connect
      enum:
        - - page:read
        - - page:read
          - document:read
        - - page:read
          - document:read
          - document:write
        - - page:read
          - mcp:connect
        - - page:read
          - document:read
          - mcp:connect
        - - page:read
          - document:read
          - document:write
          - mcp:connect
