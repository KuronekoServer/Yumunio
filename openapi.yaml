      type: object
      additionalProperties: false
      required:
        - id
        - type
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
            - paragraph
            - heading
            - heading1
            - heading2
            - checklist
            - bulleted-list
            - numbered-list
            - quote
            - divider
            - code
        data:
          type: object
          additionalProperties: false
          required: []
          properties:
            text:
              type: string
              maxLength: 100000
            level:
              type: integer
              enum:
                - 1
                - 2
                - 3
            checked:
              type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/ExternalBlock"
          maxItems: 1000
      allOf:
        - if:
            properties:
              type:
                const: divider
          then:
            properties:
              data:
                maxProperties: 0
          else:
            required:
              - data
            properties:
              data:
                required:
                  - text
        - if:
            properties:
              type:
                const: heading
          then:
            properties:
              data:
                required:
                  - level
          else:
            properties:
              data:
                not:
                  required:
                    - level
        - if:
            properties:
              type:
                const: checklist
          then:
            properties:
              data:
                required:
                  - checked
          else:
            properties:
              data:
                not:
                  required:
                    - checked
      description: "Supported text-block grammar. IDs must be unique across the entire document. Read projection
        emits no data for dividers; writes also accept an empty divider data object. Global bounds: 1000
        blocks, depth 20, and 200000 UTF-8 bytes. UTF-16 text length is bounded to 100000 code units. No
        marks, links, mention references, arbitrary metadata or imported source data can be supplied."
      x-max-tree-depth: 20
      x-max-total-blocks: 1000
    ExternalDocumentResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - page
        - document
        - omittedBlocks
      properties:
        schemaVersion:
          const: 1
        page:
          $ref: "#/components/schemas/ExternalPage"
        document:
          type: object
          additionalProperties: false
          required:
            - version
            - blocks
          properties:
            version:
              $ref: "#/components/schemas/Version"
            blocks:
              type: array
              items:
                $ref: "#/components/schemas/ExternalBlock"
              maxItems: 1000
        omittedBlocks:
          type: integer
          minimum: 0
      description: At most 200000 UTF-8 bytes. Unknown and import-source subtrees are omitted. Metadata such as
        formatting, structured references and attachment locators is never returned. page.version equals
        document.version.
    ExternalAppendBlock:
      type: object
      additionalProperties: false
      required:
        - type
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
