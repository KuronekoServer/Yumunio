  /api/content/workspaces/{workspaceId}/pages/{pageId}/room/ws:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PageId"
    get:
      operationId: streamPageRoom
      summary: Upgrade a same-origin account connection for real-time Yjs collaboration
      tags:
        - Account room collaboration
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: same-origin-account
      x-reject-query: true
      x-required-page-capability: read
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: >-
        Requires a WebSocket Upgrade and a current verified session with page access.
        After HTTP room/open, send JSON request frames containing type=request, a strictly
        increasing integer id, suffix, method, headers and an optional body. Suffixes are
        empty (GET state), /updates (POST), /renew (POST), and /presence (GET/POST/DELETE).
        The first frame must read state using the expected account, protocol 2 and room
        ticket headers. Cookies, origin and page scope cannot be supplied in a frame.
        Frame bodies and returned DTOs use the corresponding HTTP room schemas.
        Response frames contain type=response, id, status and body. Authorized peers
        receive type=changed with kind=content or presence and fetch the current delta
        through the same WebSocket. Every request and notification rechecks current
        authorization; updates are acknowledged only after durable commit. Mutations
        are not automatically replayed by the transport after a disconnect. Input frames
        are bounded to 100000 UTF-8 bytes. No credentials or tickets belong in the URL.
        Workers use one hibernating Durable Object per page; Node uses one app process.
      responses:
        "101":
          description: WebSocket connection established; a valid state frame must authenticate the room.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Page connection limit (64) or account connection limit (8) reached.
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/content/workspaces/{workspaceId}/pages/{pageId}/room/open:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/ExpectedAccount"
      - $ref: "#/components/parameters/RoomFeatures"
      - $ref: "#/components/parameters/RoomExtensions"
    post:
      operationId: openPageRoom
      summary: Explicitly create or join the current page room
      tags:
        - Account room collaboration
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: same-origin-account
      x-reject-query: true
      x-required-page-capability: read
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Requires a configured signing secret. The exact body has expectedRevision and optional protocol:2
        and reset:true (reset requires protocol:2). Creating, migrating v1 to v2 or resetting requires
        editBody and the current aggregate revision, advances one CAS and returns 201. Opening an existing
        same-protocol room requires read, returns 200 and does not write. A legacy open of v2 returns 409
        ROOM_PROTOCOL_UNSUPPORTED. Reset explicitly starts a new epoch from saved canonical content and
        invalidates other tabs; old pending updates are never replayed automatically. V2 open includes
        protocol:2, supportedFeatures and the current-recipient-projected immutable seed. A
        client must require the advertised feature before enabling checkbox input; an older server omitting
        the declaration leaves that input disabled. First check use atomically marks the epoch as requiring
        X-Yumunio-Room-Features:check-state on every room route, including open. Missing support returns 409
        ROOM_PROTOCOL_UNSUPPORTED before state or ACK release. The marker persists after Undo; explicit
        reset starts a new epoch with the saved checked value and an empty operation log/feature marker.
        Clients declaring X-Yumunio-Room-Extensions:block-transforms receive both check-state and
        block-transforms in supportedFeatures; older clients receive only check-state. Transform input
        requires the advertised feature. First split/merge/convert use atomically adds block-transforms
        to the epoch marker, after which this exact extension header is required on every room route
        and fresh CAS/renewal/presence read. Older clients stop with 409 and retain pending input.
        Fifteen-minute private HMAC tickets
        bind the current membership generation. Protocol 1 remains compatible for title and existing text.
        Protocol 2 supports bounded block add/move/remove/check commands, negotiated split/merge/convert,
        five text styles, safe HTTP(S) links and
        local selective Undo/Redo. Existing unknown/import payloads and reference targets stay in the server
        baseline. Transforms preserve physical Y.Text ranges and peer input through selective Undo.
        Code/divider blocks from the epoch seed cannot change type; text-to-code requires no annotations,
        and text-to-divider requires empty text and no children. Conflicting conversions are skipped
        without losing input. New reference IDs, column-layout changes, table editing and cross-page moves
        are not supported during the room. No whole-document JSON last-write-wins fallback or automatic epoch
        compaction is used.
      requestBody:
        required: true
        x-max-utf8-bytes: 256000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomOpenRequest"
      responses:
        "200":
          $ref: "#/components/responses/RoomOpened"
        "201":
          $ref: "#/components/responses/RoomOpened"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/RoomConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/JsonContentRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/content/workspaces/{workspaceId}/pages/{pageId}/room/updates:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/ExpectedAccount"
      - $ref: "#/components/parameters/RoomFeatures"
      - $ref: "#/components/parameters/RoomExtensions"
    post:
