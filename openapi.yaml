        - status
        - reason
        - version
        - startVersion
        - missedFromVersion
        - missedThroughVersion
        - gapAcknowledgedAt
      properties:
        id:
          $ref: "#/components/schemas/UuidV4"
        status:
          type: string
          enum:
            - active
            - paused
            - cancelled
            - quarantined
        reason:
          type:
            - string
            - "null"
          enum:
            - null
            - capacity
            - restore
            - authority
            - profile
            - approval
            - user
        version:
          $ref: "#/components/schemas/MutableVersion"
        startVersion:
          $ref: "#/components/schemas/MutableVersion"
        missedFromVersion:
          anyOf:
            - $ref: "#/components/schemas/MutableVersion"
            - type: "null"
        missedThroughVersion:
          anyOf:
            - $ref: "#/components/schemas/MutableVersion"
            - type: "null"
        gapAcknowledgedAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      description: Missing-version endpoints are either both null or an ordered inclusive range. Restore or a
        missing range requires explicit acknowledgement before resubscription.
