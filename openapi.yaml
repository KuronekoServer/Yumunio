    BackupArchiveId:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$
      maxLength: 80
    BackupCleanupJob:
      type: object
      additionalProperties: false
      required:
        - id
        - backupId
        - status
        - reason
        - processed
        - total
        - createdAt
        - updatedAt
        - errorCode
      properties:
        id:
          $ref: "#/components/schemas/BackupArchiveId"
        backupId:
          $ref: "#/components/schemas/BackupArchiveId"
        status:
          enum:
            - queued
            - leased
            - complete
            - blocked
            - failed
        reason:
          enum:
            - retention
            - failed
        processed:
          type: integer
          minimum: 0
          maximum: 2048
        total:
          type: integer
          minimum: 1
          maximum: 2048
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        errorCode:
          oneOf:
            - type: string
              pattern: ^[A-Z][A-Z0-9_]{0,79}$
              maxLength: 80
            - type: "null"
      description: Sanitized durable cleanup status. processed never exceeds total; complete requires equality. A
        leased row is not reclaimed by age. Blocked/failed work requires operator diagnosis, with no automatic
        retry.
      x-runtime-invariants:
        - processed <= total
        - status complete implies processed == total
    BackupCleanupStatus:
      type: object
      additionalProperties: false
      required:
        - configured
        - available
        - approved
        - policyDigest
        - destinationProfileId
        - retentionDays
        - failedGraceDays
        - approvalVersion
        - jobs
      properties:
        configured:
          type: boolean
        available:
          type: boolean
        approved:
          type: boolean
        policyDigest:
          oneOf:
            - $ref: "#/components/schemas/Digest"
            - type: "null"
        destinationProfileId:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
        failedGraceDays:
          type: integer
          minimum: 1
          maximum: 3650
        approvalVersion:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/BackupCleanupJob"
          minItems: 0
          maxItems: 20
      description: Configured is the explicit cleanup flag with backup enabled; available additionally requires all
        three explicitly migrated maintenance tables. Approved is a currently valid
        destination/policy/key-bound approval. policyDigest and destinationProfileId are null when backup is
        disabled. No raw object keys, plan, archive body, approver identity or secret is returned.
      allOf:
        - if:
            properties:
              available:
                const: false
            required:
              - available
          then:
            properties:
              jobs:
                maxItems: 0
        - if:
            properties:
              approved:
                const: true
            required:
              - approved
          then:
            properties:
              configured:
                const: true
              available:
                const: true
              policyDigest:
                $ref: "#/components/schemas/Digest"
              destinationProfileId:
                $ref: "#/components/schemas/Id"
              approvalVersion:
                type: integer
                minimum: 1
                maximum: 9007199254740991
    BackupCleanupResponse:
      type: object
      additionalProperties: false
      required:
        - cleanup
      properties:
        cleanup:
          $ref: "#/components/schemas/BackupCleanupStatus"
