            properties:
              data:
                not:
                  required:
                    - checked
      description: New supported text block. The server generates the ID when omitted. Existing IDs cannot be reused.
      x-max-tree-depth: 20
      x-max-total-blocks: 1000
    BlockEditRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - operations
      properties:
        expectedVersion:
          $ref: "#/components/schemas/MutableVersion"
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            oneOf:
              - type: object
                additionalProperties: false
                required:
                  - type
                  - blocks
                properties:
                  type:
                    const: append
                  parentId:
                    anyOf:
                      - $ref: "#/components/schemas/Id"
                      - type: "null"
                  blocks:
                    type: array
                    minItems: 1
                    maxItems: 1000
                    items:
                      $ref: "#/components/schemas/ExternalAppendBlock"
              - type: object
                additionalProperties: false
                required:
                  - type
                  - blockId
                  - data
                properties:
                  type:
                    const: update
                  blockId:
                    $ref: "#/components/schemas/Id"
                  data:
                    type: object
                    additionalProperties: false
                    minProperties: 1
                    properties:
                      text:
                        type: string
                        maxLength: 100000
                      level:
                        enum:
                          - 1
                          - 2
                          - 3
                      checked:
                        type: boolean
              - type: object
                additionalProperties: false
                required:
                  - type
                  - blockId
                properties:
                  type:
                    const: delete
                  blockId:
                    $ref: "#/components/schemas/Id"
      description: Apply operations in order as one transaction and one document version. Update accepts only data
        fields of the existing supported block type. Omitted and unrelated blocks are preserved. Omitted
        descendants cannot be targeted; deleting a subtree with omitted blocks fails. Read the current version
        before editing. Never automatically retry a conflict or an uncertain response.
    DocumentWriteRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
      properties:
        expectedVersion:
          $ref: "#/components/schemas/MutableVersion"
        title:
          $ref: "#/components/schemas/Title"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExternalBlock"
          maxItems: 1000
      anyOf:
        - required:
            - title
        - required:
            - blocks
      description: Replace title and/or the complete bounded block tree. Body replacement fails with 409
        EXTERNAL_DOCUMENT_READ_ONLY if current output omits any blocks, or a type conversion would lose
        existing metadata. Title-only updates remain allowed. Same-ID/same-type metadata is retained, and
        existing formatting/structured-link ranges are rebased. expectedVersion is required; aggregate
        revisions are private. No automatic conflict retry.
