webhooks:
  pageUpdateMetadata:
    post:
      operationId: receivePageUpdateMetadata
      summary: Receive signed page-update metadata at the operator-configured HTTPS destination
      tags:
        - Outbound Webhook delivery
      description: 'This is an outbound POST to the receiver URL configured by the server operator; it is not an
        inbound Yumunio route. The selected events concern actual title and/or block changes on an existing
        non-trashed page. Creation, moving, trashing and restoring have no dedicated event here. Verify
        HMAC-SHA-256 over UTF-8 timestamp + "." + the exact canonical JSON body and enforce a timestamp
        tolerance (reference helper: 300 seconds). Persistently deduplicate eventId. At-least-once delivery
        can duplicate or reorder events. 2xx acknowledges HTTP receipt only; response bodies are ignored. No
        browser Cookie/Authorization is forwarded and redirects are not followed.'
      security:
        - WebhookSignature: []
      parameters:
        - in: header
          name: X-Yumunio-Event-Id
          required: true
          schema:
            $ref: "#/components/schemas/UuidV4"
          description: Matches eventId in the body.
        - in: header
          name: X-Yumunio-Event-Type
          required: true
          schema:
            $ref: "#/components/schemas/WebhookEventType"
          description: Matches eventType in the body.
        - in: header
          name: X-Yumunio-Timestamp
          required: true
          schema:
            type: string
            pattern: ^\d{1,12}$
          description: Unix seconds for this delivery attempt, not necessarily occurredAt.
        - in: header
          name: X-Yumunio-Signature
          required: true
          schema:
            type: string
            pattern: ^sha256=[a-f0-9]{64}$
          description: Per-attempt HMAC-SHA-256 using the independent operator signing key. Never treat this as a
            reusable static API token.
      requestBody:
        required: true
        description: Strict JSON object; maximum 1024 UTF-8 bytes.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEvent"
        x-max-utf8-bytes: 1024
      responses:
        2XX:
          description: Receiver accepts this HTTP attempt; no response body is retained.
        default:
          description: 408/425/429/5xx, timeout and transport failure retry up to four total attempts; other 4xx and all
            3xx terminate. Redirects and Retry-After are not followed.
      x-delivery-policy:
        attempts: 4
        timeoutMilliseconds: 5000
        retryDelaysSeconds:
          - 30
          - 300
          - 1800
        signatureToleranceSeconds: 300
        deduplicateBy: eventId
components:
  securitySchemes:
    PersonalToken:
      type: http
      scheme: bearer
      bearerFormat: Yumunio personal token
      description: Issued by POST /api/integrations/tokens. Stored only as a hash. Explicit page-bound application
        permissions are listed by x-required-scopes; these are not OAuth scopes. No cookie fallback.
    SessionCookie:
      type: apiKey
      in: cookie
      name: yumunio.account.session_token
      description: Verified account session on an HTTP local/development origin. Use browser credentials, with
        X-Yumunio-Expected-Account; do not manually copy session cookies.
    SecureSessionCookie:
      type: apiKey
      in: cookie
      name: __Secure-yumunio.account.session_token
      description: Verified account session on an HTTPS origin. HttpOnly, SameSite=Strict, Secure. The
        expected-account header is still required.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Yumunio-Signature
      description: Receiver-only dynamic HMAC header for outbound Webhooks. Verify timestamp + "." + canonical raw
        JSON with the independent configured key. Not an inbound authentication scheme.
  parameters:
    TeamspaceId:
      name: teamspaceId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ThreadId:
      in: path
      name: threadId
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    MessageId:
      in: path
      name: messageId
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    PageId:
      in: path
      name: pageId
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    WorkspaceId:
      in: path
      name: workspaceId
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    TokenId:
      in: path
      name: tokenId
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{32}$
    EventId:
      in: path
      name: eventId
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
    ExpectedAccount:
      in: header
      name: X-Yumunio-Expected-Account
      required: true
      schema:
        $ref: "#/components/schemas/Id"
      description: Must exactly equal the verified cookie-session account ID. This is an account-switch guard, not
        authentication.
    MutationOrigin:
      in: header
      name: Origin
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly match the deployment public origin. No cross-origin CORS permission is provided.
    RoomTicket:
      in: header
      name: X-Yumunio-Room-Ticket
      required: true
      schema:
        $ref: "#/components/schemas/RoomTicket"
      description: Private signed room capability, also requiring the matching live cookie account.
    RoomStateVector:
      in: header
      name: X-Yumunio-State-Vector
      required: false
      schema:
        $ref: "#/components/schemas/RoomStateVector"
      description: Canonical base64 Yjs state vector, at most 1024 decoded bytes and 64 clients.
    PresenceClient:
      in: header
      name: X-Yumunio-Presence-Client
      required: true
      schema:
        $ref: "#/components/schemas/UuidV4"
      description: Lowercase UUIDv4 generated per browser instance; not a credential or account identity.
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OptionalExpectedAccount:
      in: header
      name: X-Yumunio-Expected-Account
      required: false
      schema:
        $ref: "#/components/schemas/Id"
      description: First-party clients send their captured account ID. A supplied expectation must match the
        verified cookie session. This legacy content endpoint also accepts omission; it never treats the
        header as authentication.
    GrantId:
      name: grantId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RoomProtocol:
      name: X-Yumunio-Room-Protocol
      in: header
      required: false
      schema:
        const: "2"
      description: Required with value 2 for every protocol-2 state, updates, renewal and presence request. Omitted
        for legacy protocol 1. Opening selects the protocol in its JSON body. A missing/mismatched protocol
        for a v2 room returns 409 without room state.
    RoomFeatures:
      name: X-Yumunio-Room-Features
      in: header
      required: false
      schema:
        const: check-state
      description: Explicit parser support, never an authorization grant. After the first checklist state
        command commits, this exact value is required on all room routes, including open/renew/presence.
        The requirement is rechecked against fresh CAS/renewal/presence state and remains for the epoch
        after Undo. Missing support returns 409 ROOM_PROTOCOL_UNSUPPORTED without seed, state or ACK.
    RoomExtensions:
      name: X-Yumunio-Room-Extensions
      in: header
      required: false
      schema:
        const: block-transforms
      description: Explicit parser support for bounded split, merge and kind conversion. Declaring this
        header on open enables the block-transforms supportedFeatures advertisement. Once a transform
        commits, this exact header is required on every room route and fresh authorization/CAS read for
        the epoch, including after Undo. Missing support returns 409 without seed, state or ACK. The
        separate check-state header keeps its existing exact value. Neither header grants access.
  responses:
    RoomState:
      description: Current text-only room state or requested delta; no ticket is returned.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomStateResponse"
    RoomOpened:
      description: Current room state and a newly issued private 15-minute ticket.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomOpenResponse"
    RoomUpdated:
      description: Text update acknowledged after durable CAS, or an already-applied identical replay.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomUpdateResponse"
    RoomRenewed:
      description: Same-epoch ticket renewed without changing the durable document.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomRenewResponse"
    RoomPresence:
      description: Current authorized temporary roster and cursors on the exact current room basis.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomPresenceResponse"
    RoomLeft:
      description: This account/session/browser entry has been removed or was already absent.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomPresenceLeftResponse"
    RoomConflict:
      description: ROOM_EPOCH_CHANGED, ROOM_PROTOCOL_UNSUPPORTED, ROOM_CAPACITY, content CAS/capacity or presence
        conflicts. Preserve and review the local draft. Do not replay an old epoch. Capacity recovery uses an
        explicit saved-content reset.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JsonContentRequired:
      description: The account content mutation must use application/json; CONTENT_TYPE is returned otherwise.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PresenceCapacity:
      description: ROOM_PRESENCE_CAPACITY; the room or account browser-instance quota is full.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TeamspaceConflict:
      description: CONTENT_CONFLICT (stale revision/version or duplicate join), TEAMSPACE_REVIEW_CHANGED (review
        digest no longer matches), TEAMSPACE_ARCHIVED (updates paused), LAST_TEAMSPACE_OWNER or
        LAST_PAGE_MANAGER. No partial write; refetch and explicitly review instead of blindly retrying.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Malformed JSON, unexpected fields, invalid content or missing/invalid expected-account header.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing/invalid verified session or Bearer credential; wrong page/scope, expiry, revocation or
        current authority loss.
      headers:
        Cache-Control:
          schema:
            const: no-store
        WWW-Authenticate:
          description: Bearer challenge on token-authentication failures; not required for cookie-only Webhook endpoints.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Origin, fetch-site or forbidden Authorization header rejected.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Path/query rejected, expected-account mismatch, or current page/manage access unavailable. Hidden
        targets are not disclosed.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MethodNotAllowed:
      description: This method is not supported.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: CAS/version/profile conflict, missing approval, or body replacement would lose read-only
        source/metadata. Refetch and review; do not automatically retry.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: The UTF-8 request/document exceeds a bounded limit. Partial output is not returned.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyTokens:
      description: The personal active-token or token-metadata quota is full.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Feature disabled, missing explicit schema migration, recovery gate, invalid deployment
        configuration, or unavailable storage.
      headers:
        Cache-Control:
          schema:
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    PublicFormField:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - description
        - required
        - type
        - condition
      properties:
        id:
          $ref: "#/components/schemas/Id"
        label:
          type: string
          maxLength: 240
          minLength: 1
        description:
          type: string
          maxLength: 1000
        required:
