      maxLength: 2500
      pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
      description: Opaque private HMAC-signed capability. Bound to account, membership generation, workspace, page,
        epoch, editability and 15-minute expiry. Not an independent login/session token.
    RoomStateVector:
      type: string
      minLength: 4
      maxLength: 1368
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      contentEncoding: base64
      x-max-decoded-bytes: 1024
      description: Canonical base64 Yjs vector; runtime validates its complete bounded binary grammar.
    RoomEncodedState:
      type: string
      minLength: 4
      maxLength: 213336
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      contentEncoding: base64
      x-max-decoded-bytes: 160000
      description: Canonical base64 Yjs V1 binary state/delta. Protocol 1 contains existing Y.Text fields. Protocol
        2 additionally supports a bounded immutable node registry, per-operation structural commands and
        validated text attributes. Private reference targets remain server-owned; opaque tokens reference
        projected seed runs. Wire allocation and grammar limits are enforced before acceptance.
    RoomEncodedUpdate:
      type: string
      minLength: 4
      maxLength: 85336
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      contentEncoding: base64
      x-max-decoded-bytes: 64000
      description: Canonical base64 Yjs V1 binary update, at most 64000 decoded bytes. Protocol 1 permits existing
        plain Y.Text fields. Protocol 2 permits supported add/move/remove operations and five text styles or
        safe HTTP(S) links. Arbitrary rich JSON replacement, embeds, nested shared types and new reference
        identifiers are rejected.
