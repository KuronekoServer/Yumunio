          pattern: ^(HTTP_[1-5]\d\d|TRANSPORT|TIMEOUT|LEASE_EXPIRED|CAPACITY|USER_CANCELLED|AUTHORITY|PROFILE|APPROVAL|RESTORE|EXHAUSTED|INTEGRITY)$
