    delete:
      operationId: removeAccountTeamspaceMember
      summary: Remove a participant or leave the teamspace
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      x-required-teamspace-role: owner-or-self
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. A current
        teamspace owner may remove another participant; a current participant may remove their own
        current-generation memberId. The last owner and last live page manager cannot be removed. While
        archived, only self-leave is allowed. Private self-leave returns only the previously known teamspace
        metadata with role:null, capabilities:[], memberCount:0 and empty member/candidate arrays; subsequent
