      description: Explicit ongoing consent for expired application-created backup artifacts at the reviewed
        dedicated destination. confirmQuiescent acknowledges stopped/upgraded old runtimes and external
        restore/manual archive operations. Recomputed plan/policy and current approval generation must match;
        no caller-selected object keys, secret or operator bypass is accepted.
