# Source of truth for the documented integration and selected account content API subset. Served unchanged at /openapi.yaml.
openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: Yumunio integrations and account content API
  version: 0.1.0
  description: "Supported integration endpoints only: one-page Bearer REST, same-origin personal-token/MCP
    metadata management, same-origin Webhook administration, signed outbound metadata events and page-scoped
    account collaboration rooms/presence, atomic block-forest movement, page comments, people and private
    inbox, teamspace membership/access, reviewed root page placement, and anonymous question-only forms with
    private idempotent submissions. Public forms use an explicitly published opaque capability instead of a
    cookie or personal token. This document does not claim coverage
    of the complete editor/content API or Better Auth login/OAuth routes. All public integration features
    default off. API tokens require configured accounts and YUMUNIO_API_TOKENS_ENABLED=true; MCP additionally
    requires YUMUNIO_MCP_ENABLED=true and explicit mcp:connect consent; Webhooks require operator
    configuration and two-stage approval. Every management operation requires a verified cookie session and
    the matching expected-account header, rejects foreign Origin/fetch-site, and requires exact Origin on
    mutations. Token/Webhook/MCP metadata management rejects Authorization headers; account content routes use
    the cookie session, never a personal Bearer token; room synchronization/presence also requires a private
    room ticket. Query parameters are rejected. Responses are non-cacheable. CORS permission is not added;
    public Bearer REST targets server-to-server clients. Limits expressed as JSON Schema string lengths may
    count Unicode code points, while runtime limits use UTF-16 code units and UTF-8 bytes as described.
    Deployment hosts may also return recovery/configuration errors before endpoint processing. Selected
    server-administrator backup-maintenance endpoints are also documented; these require their own
    default-disabled env opt-in, explicit optional schema migration and reviewed ongoing deletion consent."
servers:
  - url: /
    description: This deployment origin; no hard-coded host or credential.
tags:
  - name: Public anonymous forms
    description: Explicitly published question-only capabilities; responses remain private.
  - name: Public page API
    description: Server-to-server Bearer API scoped to one current authorized page.
  - name: Account token management
    description: Same-origin first-party account APIs. Verified cookie session and expected-account guard; not
      public Bearer APIs.
  - name: Webhook configuration
    description: Same-origin authenticated profile/status read; no endpoint/key editing.
  - name: Server administrator approval
    description: Same-origin verified allowlisted server-admin approval, separate from page authority.
  - name: Page Webhook management
    description: Same-origin current page-manage authority; no server-admin bypass.
  - name: Outbound Webhook delivery
    description: Receiver contract at a fixed operator-controlled destination, not an inbound application endpoint.
  - name: Account block movement
    description: Same-origin cookie API for atomic movements within or between two editable pages.
  - name: Account comments and inbox
    description: Same-origin current-generation page discussion, authorized people and private in-app notifications.
  - name: Account room collaboration
    description: Same-origin verified account sessions with current page authority. Explicit room initialization,
      bounded Yjs text updates and temporary participant/cursor presence; not public Bearer REST.
  - name: Account teamspaces
    description: Same-origin explicit teamspace membership, bounded metadata and reviewed page placement;
      workspace/server roles do not bypass private page authority.
  - name: Account groups
    description: "Named custom access roles: workspace-managed membership groups with resource-specific grants.
      These do not grant workspace owner or administrator authority. Existing groups API and storage names are
      retained for compatibility."
  - name: Account property conversions
    description: Explicit non-destructive text-to-number/date copies with complete review and current management
      authority.
  - name: Account resource sharing
    description: Cookie-authenticated page and collection access for individual accounts. Custom access roles use
      the backward-compatible groups endpoints.
  - name: Backup maintenance administration
    description: Same-origin verified allowlisted server-admin management of default-disabled,
      dedicated-destination retention and recorded failed-artifact cleanup. Not public Bearer REST or
      arbitrary storage deletion.
x-mcp-transport:
  endpoint: /api/mcp
  method: POST
  protocol: JSON-RPC 2.0 over stateless MCP Streamable HTTP
  protocolVersion: 2025-11-25
  requiredApplicationScope: mcp:connect
  maxRequestUtf8Bytes: 256000
  description: "Intentionally excluded from REST paths. Every initialize/discovery/tool/resource request
    authenticates a page-bound personal token. tools: get_page, get_document, update_page, edit_blocks, filtered by scopes.
    Document resource exists only with document:read. GET/DELETE return 405; no reusable server session ID or
    model execution."
paths:
  /api/public/forms/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
          minLength: 160
          maxLength: 2048
          pattern: ^[a-f0-9]+$
        description: Opaque form capability. Do not place private workspace IDs or credentials here.
    get:
      tags:
        - Public anonymous forms
      security: []
      x-audience: anonymous-capability
      x-reject-query: true
      operationId: readAnonymousForm
      summary: Read only the questions of the current public form
      description: No account or cookie authentication. Returns no internal property, workspace, account or answer
        page IDs. Rechecks the publisher generation and current authority.
      responses:
        "200":
          description: Current questions only.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormDefinition"
        "400":
          description: Form request rejected; no private response data is returned.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormError"
        "403":
          description: Form request rejected; no private response data is returned.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormError"
        "404":
          description: Unknown, stopped, replaced or unauthorized public form capability.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormError"
        "405":
          description: Form request rejected; no private response data is returned.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormError"
        "409":
