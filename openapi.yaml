              maxLength: 100000
            level:
              type: integer
              enum:
                - 1
                - 2
                - 3
            checked:
              type: boolean
        children:
          type: array
          items:
            $ref: "#/components/schemas/ExternalAppendBlock"
          maxItems: 1000
      allOf:
        - if:
            properties:
              type:
                const: divider
          then:
            properties:
              data:
                maxProperties: 0
          else:
            required:
              - data
            properties:
              data:
                required:
                  - text
        - if:
            properties:
              type:
                const: heading
          then:
            properties:
              data:
                required:
                  - level
          else:
            properties:
              data:
                not:
                  required:
