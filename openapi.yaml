      description: Read a current authorized room state or state-vector delta with a valid current
        account/membership/page/epoch ticket. State has protocol:2 only for v2. The immutable seed is returned
        only by open. Protocol 1 remains compatible for title and existing text. Protocol 2 supports bounded
