      description: Read-only bounded review. The keeper is the latest matching successful archive whose complete
        contents have been verified. It cannot be a candidate. planDigest binds the full private plan and
        current policy; preview writes no approval or cleanup job. The protected list is capped, not a
        complete directory inventory.
