  /api/content/workspaces/{workspaceId}/teamspaces:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ExpectedAccount"
    get:
      operationId: listAccountTeamspaces
      summary: List discoverable teamspaces
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. Private
        teamspaces are hidden from nonparticipants, including workspace owners/admins. Open/closed metadata is
        discoverable by non-guest members, but discovery is not page access. canCreate is true for verified
        non-guest workspace members. No implicit teamspace, membership or page is created by this GET.
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
            revision once; review does not write.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamspaceListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createAccountTeamspace
      summary: Create a teamspace with the caller as its sole owner
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. Any verified
        non-guest workspace member may explicitly create one. Requires current expectedRevision. Creates one
        teamspace and one membership bound to the caller current workspace generation in one aggregate CAS.
        Limits are 64 teamspaces and 1000 teamspace memberships per workspace. No client-chosen owner, ID,
        membership generation or page assignment is accepted.
      requestBody:
        required: true
        x-max-utf8-bytes: 256000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamspaceCreateRequest"
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
            revision once; review does not write.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamspaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/TeamspaceConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/JsonContentRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/content/workspaces/{workspaceId}/teamspaces/{teamspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ExpectedAccount"
      - $ref: "#/components/parameters/TeamspaceId"
    get:
      operationId: getAccountTeamspace
      summary: Read visible teamspace metadata and authorized participant details
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. A current
        participant can see member identities. Only a current teamspace owner receives candidates. Eligible
        nonparticipants discovering open/closed metadata receive members=[] and candidates=[]. Hidden/private
        targets return 404.
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
            revision once; review does not write.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamspaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/Unavailable"
    patch:
      operationId: updateAccountTeamspace
      summary: Update teamspace information and default access
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      x-required-teamspace-role: owner
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. Only a current
        teamspace owner may update. All editable fields and confirmAccessChange:true are required; this is a
        full metadata update rather than a sparse patch. Default member permission is viewer/commenter/editor;
        teamspace owners have full access at explicitly placed roots, subject to explicit deny and inheritance
        boundaries. Existing page grants remain unchanged. Archived updates return TEAMSPACE_ARCHIVED. The
        last live page manager is preserved and affected rooms are invalidated in the guarded CAS.
      requestBody:
        required: true
        x-max-utf8-bytes: 256000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamspaceUpdateRequest"
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
            revision once; review does not write.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamspaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/TeamspaceConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/JsonContentRequired"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/content/workspaces/{workspaceId}/teamspaces/{teamspaceId}/members:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ExpectedAccount"
      - $ref: "#/components/parameters/TeamspaceId"
    post:
      operationId: setAccountTeamspaceMember
      summary: Add a participant or change their teamspace role
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      x-required-teamspace-role: owner
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. Only a current
        teamspace owner may add/change verified active non-guest workspace members. Role is owner or member,
        separate from workspace roles. Server binds the current membership generation. Last teamspace owner
        and last page manager are preserved. Archived teamspace changes return TEAMSPACE_ARCHIVED. No
        invitation, email or workspace-role change is performed.
      requestBody:
        required: true
        x-max-utf8-bytes: 256000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamspaceMemberRequest"
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
            revision once; review does not write.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamspaceDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "409":
          $ref: "#/components/responses/TeamspaceConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/JsonContentRequired"
        "503":
