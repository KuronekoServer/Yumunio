        createdAt:
          $ref: "#/components/schemas/Timestamp"
        readAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        reason:
          const: inline-mention
      description: Current private page reference for a newly added person mention in an ordinary session
        page update. Contains no text snippet, block, recipient or membership ID and never grants access.
        Current verified recipient membership, page read access and the still-present person binding are
        required. Open pageId directly rather than a comment thread. Self mentions, unchanged bindings,
        initial page bodies, imports, templates, history, block transfers and external REST/MCP updates do
        not create events. Removal followed by explicit re-addition creates a new event. Text and metadata
        commit atomically within the shared notification quotas; a capacity error preserves the prior page.
