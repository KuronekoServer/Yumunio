      type: object
      additionalProperties: false
      required:
        - expectedRevision
      properties:
        expectedRevision:
          $ref: "#/components/schemas/ExpectedVersionOrZero"
        protocol:
          const: 2
        reset:
          const: true
      dependentRequired:
        reset:
          - protocol
    RoomRenewRequest:
      type: object
      additionalProperties: false
      required:
        - epoch
        - ticket
      properties:
        epoch:
          $ref: "#/components/schemas/Id"
