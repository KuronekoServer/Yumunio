  /api/public/forms/{token}/responses:
    parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
          minLength: 160
          maxLength: 2048
          pattern: ^[a-f0-9]+$
        description: Opaque form capability. Do not place private workspace IDs or credentials here.
    post:
      tags:
        - Public anonymous forms
      security: []
      x-audience: anonymous-capability
      x-reject-query: true
      operationId: submitAnonymousForm
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      summary: Submit typed answers to a private record
      description: Requires exact deployment Origin. Maximum 64000 UTF-8 bytes. First success is 201; an identical
        request ID, version and normalized answers replay as 200. A conflicting replay is 409. The form-wide
        persistent limits are 20 attempts/minute and 200/hour, including invalid bodies reaching a valid form.
        Responses reveal no answer page ID.
      requestBody:
        required: true
        x-max-utf8-bytes: 64000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicFormSubmission"
      responses:
        "200":
          description: Identical accepted submission replay.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFormReceipt"
        "201":
          description: New private answer accepted.
          headers:
            Cache-Control:
              schema:
                const: no-store
            X-Robots-Tag:
              schema:
                const: noindex, nofollow, noarchive
          content:
            application/json:
