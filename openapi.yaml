  /api/content/workspaces/{workspaceId}/teamspaces/{teamspaceId}/join:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/ExpectedAccount"
      - $ref: "#/components/parameters/TeamspaceId"
    post:
      operationId: joinAccountTeamspace
      summary: Explicitly join an open teamspace
      tags:
        - Account teamspaces
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: account
      x-reject-query: true
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      description: Verified same-origin cookie session, active verified workspace membership and matching
        X-Yumunio-Expected-Account are required. Query parameters and foreign Origin/fetch-site are rejected.
        Mutations require exact Origin and application/json. A Bearer token never replaces the cookie;
        workspace/server administrator status is not a private teamspace or page-access bypass. Only a
        verified non-guest workspace member may self-join an active open teamspace. Joins as member, with the
        configured default page permission, only after explicit submission. Closed/private joining returns
        404; already joined or stale revision returns 409. Archived joining returns TEAMSPACE_ARCHIVED. No
        public Internet access or automatic guest membership is granted.
      requestBody:
        required: true
        x-max-utf8-bytes: 256000
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamspaceRevisionRequest"
      responses:
        "200":
          description: Current authorized projection after a successful request. Mutations advance the aggregate
