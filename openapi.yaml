        - $ref: "#/components/parameters/RoomProtocol"
      description: Read-only viewers may publish presence. The server derives identity and name from the live
        session/membership; clients cannot supply names or identities. Cursor offsets use UTF-16, stay within
        one currently editable text block and cannot split surrogate pairs. Title/source/ unsupported block
        cursors are rejected. If sequence or documentVersion differs from the current room basis, the cursor
        is discarded rather than applied at the wrong location. A 30-second TTL is refreshed without changing
        the durable document, aggregate revision or history. Clients should heartbeat about every ten seconds.
        Quotas are 64 participants per room and eight browser instances per account per room; a full quota
        returns 429. Membership/session/content CAS guards fence the write and names are rechecked before
