        - confirmMetadataTransfer
        - acknowledgeMissing
      properties:
        expectedRevision:
          $ref: "#/components/schemas/MutableVersion"
        expectedVersion:
          $ref: "#/components/schemas/ExpectedVersionOrZero"
        profileDigest:
          $ref: "#/components/schemas/Digest"
        confirmMetadataTransfer:
          const: true
        acknowledgeMissing:
          type: boolean
        confirmDescendants:
          const: true
          description: Required only when the selected profile includes descendants. Rejected for an exact-page profile.
      description: expectedVersion is zero for a first subscription. Current server approval is required. Descendant
