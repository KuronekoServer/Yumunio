  /api/admin/backups/cleanup/preview:
    parameters:
      - $ref: "#/components/parameters/ExpectedAccount"
    post:
      operationId: previewBackupArtifactCleanup
      summary: Review expired recorded artifacts at the configured dedicated backup destination
      tags:
        - Backup maintenance administration
      security:
        - SessionCookie: []
        - SecureSessionCookie: []
      x-audience: server-admin
      x-reject-query: true
      description: Verified cookie session, current server-admin allowlist and exact X-Yumunio-Expected-Account are
        required. Workspace owner/admin authority alone is insufficient. Foreign Origin/fetch-site, query
        strings, wrong account, unknown method/path and missing exact Origin on mutations return
        ADMIN_NOT_FOUND / 404. A Bearer header does not replace the cookie. Responses are no-store. Backup
        cleanup defaults off; YUMUNIO_BACKUP_CLEANUP_ENABLED=true and explicit backup schema migration (Node
        backup:migrate / D1 0005) are prerequisites. Existing ordinary backup remains usable with the old
        optional schema. Marker creation at enabled startup is coordination, not deletion approval. Recomputes
        the bounded read-only plan against at most 1000 backup jobs, 20 candidates and 2048 recorded objects
        per archive. Success records and authenticated manifests must match; completed archives require both
        terminal and authenticated creation age beyond retention. Failed/cancelled jobs require pre-PUT
        artifact ledger records and grace age. Unknown/legacy untracked files are never inferred from
        listings. A fully verified latest good archive, live backup/restore gates and other keys remain
        protected.
      parameters:
        - $ref: "#/components/parameters/MutationOrigin"
      requestBody:
        required: true
        x-max-utf8-bytes: 4096
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupCleanupPreviewRequest"
      responses:
        "200":
          description: Current sanitized review/approval/job projection; not a restore-success claim.
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupCleanupPreviewResponse"
        "400":
          description: "Malformed JSON/body above 4096 bytes or invalid exact request shape: INVALID_BACKUP_REQUEST.
            Missing ongoing scope/quiescent consent: BACKUP_CLEANUP_CONSENT_REQUIRED."
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "ADMIN_NOT_FOUND: no visible administration authority, expected-account mismatch, foreign
            origin/fetch-site/query, or unsupported method."
          headers:
            Cache-Control:
              schema:
                const: no-store
          content:
            application/json:
              schema:
