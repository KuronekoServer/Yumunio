                value:
                  type:
                    - string
                    - number
                    - boolean
        options:
          type: array
          maxItems: 1000
          items:
            type: string
            maxLength: 240
    PublicFormDefinition:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - title
        - description
        - accountRequired
        - accessToSubmission
        - fields
      properties:
        id:
          const: public-form
        version:
          $ref: "#/components/schemas/MutableVersion"
        title:
          type: string
          maxLength: 240
          minLength: 1
        description:
          type: string
          maxLength: 4000
        accountRequired:
          const: false
        accessToSubmission:
          const: none
        fields:
          type: array
          minItems: 1
          maxItems: 64
          items:
            $ref: "#/components/schemas/PublicFormField"
    PublicFormSubmission:
      type: object
      additionalProperties: false
      required:
        - requestId
        - version
        - answers
      properties:
        requestId:
          $ref: "#/components/schemas/UuidV4"
        version:
          $ref: "#/components/schemas/MutableVersion"
        answers:
          type: object
          maxProperties: 64
          propertyNames:
            $ref: "#/components/schemas/Id"
          additionalProperties:
            anyOf:
