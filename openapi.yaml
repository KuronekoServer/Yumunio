    WebhookProfile:
      type: object
      additionalProperties: false
      required:
        - label
        - endpointOrigin
        - profileDigest
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 80
        endpointOrigin:
          type: string
          format: uri
          pattern: ^https://[^/@?#]+$
          maxLength: 2048
        profileDigest:
          $ref: "#/components/schemas/Digest"
        includeDescendants:
          const: true
          description: Present only for an operator-enabled descendant scope. The profile digest binds this scope; the
            default is exact-page scope.
      description: Only the fixed endpoint origin is public. No endpoint path or signing key is exposed or accepted
        through these APIs.
    WebhookApproval:
      type: object
      additionalProperties: false
      required:
        - version
        - approved
      properties:
        version:
          $ref: "#/components/schemas/MutableVersion"
        approved:
          type: boolean
    WebhookLimits:
      type: object
      additionalProperties: false
      required:
        - pending
        - metadata
        - attempts
      properties:
        pending:
          const: 1000
        metadata:
          const: 10000
        attempts:
          const: 4
    WebhookConfig:
      type: object
      additionalProperties: false
      required:
        - enabled
        - canApprove
        - profile
        - eventTypes
        - limits
        - approval
      properties:
        enabled:
          type: boolean
        canApprove:
          type: boolean
        profile:
          anyOf:
            - $ref: "#/components/schemas/WebhookProfile"
            - type: "null"
        eventTypes:
          $ref: "#/components/schemas/WebhookEventTypes"
        limits:
          $ref: "#/components/schemas/WebhookLimits"
        approval:
          anyOf:
            - $ref: "#/components/schemas/WebhookApproval"
            - type: "null"
      allOf:
        - if:
            properties:
              enabled:
                const: false
          then:
            properties:
              profile:
                type: "null"
              approval:
                type: "null"
              eventTypes:
                const:
                  - page.updated
          else:
            properties:
              profile:
                $ref: "#/components/schemas/WebhookProfile"
    WebhookApproveRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - profileDigest
