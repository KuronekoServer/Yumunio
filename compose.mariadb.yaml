# MariaDB self-host database example. Combine with compose.yaml; initialize a new dedicated volume.
services:
  yumunio:
    environment:
      YUMUNIO_STORAGE: mariadb
      YUMUNIO_ACCESS_KEY: "${YUMUNIO_ACCESS_KEY:-}"
      YUMUNIO_PUBLIC_ORIGIN: "${YUMUNIO_PUBLIC_ORIGIN:-http://127.0.0.1:8788}"
      YUMUNIO_DATABASE_URL: "${YUMUNIO_DATABASE_URL:?Set mysql://yumunio:encoded-password@database:3306/yumunio}"
      YUMUNIO_DATABASE_TLS: "${YUMUNIO_DATABASE_TLS:-verify-full}"
      YUMUNIO_DATABASE_CA: "${YUMUNIO_DATABASE_CA:-}"
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: yumunio
      MARIADB_USER: yumunio
      MARIADB_PASSWORD: "${YUMUNIO_DB_PASSWORD:?Set the database password matching the URL}"
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - yumunio-mariadb:/var/lib/mysql
      - ./packages/adapters/prototype.mysql.sql:/docker-entrypoint-initdb.d/01-yumunio.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
volumes:
  yumunio-mariadb:
