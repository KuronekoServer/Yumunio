<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fafbfd">
  <title>Yumunio — ワークスペース移行</title>
  <link rel="stylesheet" href="./account.css">
  <link rel="stylesheet" href="./workspace-settings.css">
  <link rel="stylesheet" href="./import.css">
  <script type="module" src="./import-settings-navigation.js"></script>
  <script type="module" src="./import.js"></script>
</head>
<body>
  <a class="skip-link" href="#import-main">本文へ移動</a>
  <div class="settings-shell import-settings-shell" id="import-settings-shell">
    <aside class="settings-sidebar" id="import-settings-navigation" aria-label="設定">
      <a class="settings-brand" href="/account.html">Yumunio</a>
    </aside>
    <button class="settings-scrim" id="import-settings-scrim" type="button" tabindex="-1" aria-label="設定メニューを閉じる"></button>
    <div class="settings-main" id="import-settings-main">
      <header class="account-header settings-topbar">
        <button class="button settings-mobile-toggle" id="import-settings-toggle" type="button" aria-controls="import-settings-navigation" aria-expanded="false" aria-label="設定メニューを開く">☰</button>
        <a class="import-settings-back" id="import-settings-back" href="/account.html#account">設定へ戻る</a>
        <label class="language-label"><span id="language-label">言語</span><select id="language" aria-label="言語"><option value="ja">日本語</option><option value="en">English</option></select></label>
      </header>
      <div class="settings-scroll" id="import-settings-scroll">
        <main class="import-main" id="import-main" tabindex="-1"><p role="status">読み込み中…</p></main>
        <footer class="account-footer"><a id="account-back" href="/account.html">アカウントへ</a><a href="./LICENSE.txt">MIT License</a></footer>
      </div>
    </div>
  </div>
  <dialog id="import-confirm" aria-labelledby="import-confirm-heading"></dialog>
</body>
</html>
